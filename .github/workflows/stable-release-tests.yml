name: Stable Release Tests

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [pulse-v2026.7.1-base]
  push:
    branches: [pulse-v2026.7.1-base]

permissions:
  contents: read

concurrency:
  group: stable-release-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stable-release-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_TEST_PROJECTS_PARALLEL: "1"
      OPENCLAW_VITEST_MAX_WORKERS: "2"
      OPENCLAW_VITEST_NO_OUTPUT_RETRY: "1"
      OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: "300000"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.15.0

      - name: Install exact package manager and dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm install --frozen-lockfile

      - name: Run structured interim-status contract when present
        run: |
          if [[ -f src/agents/embedded-agent-runner/run/agent-end-event.test.ts ]]; then
            node scripts/run-vitest.mjs \
              src/agents/embedded-agent-runner/run/agent-end-event.test.ts \
              src/gateway/openai-http.test.ts \
              src/agents/cli-runner.reliability.test.ts
          fi

      - name: Run repository checks
        run: pnpm check

      - name: Run full tests
        run: pnpm test

      - name: Build exact stable package
        run: pnpm build
